<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - Padel Court & F&B</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #fff; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
    
    .card { background: #1e1e1e; border-radius: 12px; padding: 24px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h1 { text-align: center; color: #00e676; text-transform: uppercase; margin-bottom: 20px; font-size: 24px; }
    h2 { font-size: 16px; color: #ffeb3b; border-bottom: 1px solid #333; padding-bottom: 8px; margin: 15px 0 10px 0; }
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; color: #aaa; text-transform: uppercase; font-weight: 600; }
    
    input[type="text"], input[type="time"], input[type="number"], select {
      width: 100%; padding: 10px; background: #2a2a2a; border: 1px solid #444; border-radius: 6px; color: #fff; font-size: 14px;
    }
    input:focus, select:focus { outline: none; border-color: #00e676; }

    /* F&B Section */
    .fnb-row { display: grid; grid-template-columns: 2fr 1fr 1fr auto; gap: 10px; align-items: center; margin-bottom: 10px; }
    .btn-remove { background: #ff5252; color: #fff; border: none; padding: 10px; border-radius: 6px; cursor: pointer; }
    .btn-add { background: #29b6f6; color: #000; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 5px; }

    /* Summary Section */
    .summary-box { background: #252525; border-radius: 8px; padding: 15px; margin-top: 20px; }
    .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 14px; color: #ddd; }
    .summary-total { display: flex; justify-content: space-between; margin-top: 12px; padding-top: 12px; border-top: 1px dashed #555; font-size: 18px; font-weight: bold; color: #00e676; }

    /* Buttons */
    .btn-submit { width: 100%; background: #00e676; color: #000; border: none; padding: 14px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; margin-top: 20px; transition: 0.2s; }
    .btn-submit:hover { background: #00c853; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h1>Dashboard Admin Reservasi</h1>

    <!-- Data Lapangan & Member -->
    <h2>1. Informasi Lapangan & Member</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Pilih Lapangan</label>
        <select id="select-court" onchange="calculateTotal()">
          <option value="150000">Lapangan 1 (Rp 150.000 / Jam)</option>
          <option value="150000">Lapangan 2 (Rp 150.000 / Jam)</option>
          <option value="200000">Lapangan VIP (Rp 200.000 / Jam)</option>
        </select>
      </div>

      <div class="form-group">
        <label>Status Member</label>
        <select id="select-member" onchange="calculateTotal()">
          <option value="0">Non-Member (Tanpa Diskon)</option>
          <option value="0.10">Member Silver (Diskon 10%)</option>
          <option value="0.20">Member Gold (Diskon 20%)</option>
        </select>
      </div>
    </div>

    <!-- Data Pemain -->
    <h2>2. Informasi Pemain</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Tim A (Pemain 1 & 2)</label>
        <input type="text" id="team-a" placeholder="Nama Tim A / Pemain">
      </div>
      <div class="form-group">
        <label>Tim B (Pemain 1 & 2)</label>
        <input type="text" id="team-b" placeholder="Nama Tim B / Pemain">
      </div>
    </div>

    <!-- Jam Main -->
    <h2>3. Waktu Permainan</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>Jam Mulai</label>
        <input type="time" id="time-start" value="14:00" onchange="calculateTotal()">
      </div>
      <div class="form-group">
        <label>Jam Selesai</label>
        <input type="time" id="time-end" value="16:00" onchange="calculateTotal()">
      </div>
    </div>

    <!-- Additional Food & Beverage -->
    <h2>4. Additional Food & Beverage</h2>
    <div id="fnb-container">
      <!-- Row Item F&B akan dimasukkan secara dinamis melalui JavaScript -->
    </div>
    <button type="button" class="btn-add" onclick="addFnbRow()">+ Tambah F&B / Lainnya</button>

    <!-- Total Harga -->
    <div class="summary-box">
      <div class="summary-row">
        <span>Sewa Lapangan (<span id="duration-text">0</span> jam)</span>
        <span id="court-cost-text">Rp 0</span>
      </div>
      <div class="summary-row">
        <span>Total Food & Beverage</span>
        <span id="fnb-cost-text">Rp 0</span>
      </div>
      <div class="summary-row">
        <span>Diskon Member</span>
        <span id="discount-text">- Rp 0</span>
      </div>
      <div class="summary-total">
        <span>TOTAL BAYAR</span>
        <span id="grand-total-text">Rp 0</span>
      </div>
    </div>

    <button class="btn-submit" onclick="submitBooking()">Simpan Data & Transaksi</button>
  </div>
</div>

<script>
  // Daftar Menu F&B & Harga
  const fnbMenu = [
    { name: "Air Mineral 600ml", price: 5000 },
    { name: "Isotonik / Pocari 500ml", price: 10000 },
    { name: "Kopi Espresso / Americano", price: 18000 },
    { name: "Club Sandwich", price: 25000 },
    { name: "French Fries", price: 15000 },
    { name: "Sewa Raket Padel Extra", price: 30000 }
  ];

  // Tambah Baris F&B Baru
  function addFnbRow() {
    const container = document.getElementById('fnb-container');
    const row = document.createElement('div');
    row.className = 'fnb-row';

    let optionsHtml = fnbMenu.map((item, index) => 
      `<option value="${index}">${item.name} - Rp ${item.price.toLocaleString('id-ID')}</option>`
    ).join('');

    row.innerHTML = `
      <select class="fnb-select" onchange="calculateTotal()">
        ${optionsHtml}
      </select>
      <input type="number" class="fnb-qty" value="1" min="1" onchange="calculateTotal()">
      <input type="text" class="fnb-subtotal" value="Rp 0" readonly>
      <button type="button" class="btn-remove" onclick="removeFnbRow(this)">✕</button>
    `;

    container.appendChild(row);
    calculateTotal();
  }

  function removeFnbRow(btn) {
    btn.parentElement.remove();
    calculateTotal();
  }

  // Kalkulasi Otomatis Total Harga
  function calculateTotal() {
    // 1. Hitung Durasi & Biaya Lapangan
    const courtRate = parseFloat(document.getElementById('select-court').value);
    const start = document.getElementById('time-start').value;
    const end = document.getElementById('time-end').value;

    let durationHours = 0;
    if (start && end) {
      const [startH, startM] = start.split(':').map(Number);
      const [endH, endM] = end.split(':').map(Number);
      
      let diffMinutes = (endH * 60 + endM) - (startH * 60 + startM);
      if (diffMinutes < 0) diffMinutes += 24 * 60; // Antisipasi lewat tengah malam
      durationHours = diffMinutes / 60;
    }

    const courtCost = durationHours * courtRate;
    document.getElementById('duration-text').innerText = durationHours.toFixed(1);
    document.getElementById('court-cost-text').innerText = `Rp ${courtCost.toLocaleString('id-ID')}`;

    // 2. Hitung Total F&B
    let fnbTotal = 0;
    const fnbRows = document.querySelectorAll('.fnb-row');
    
    fnbRows.forEach(row => {
      const selectedIndex = row.querySelector('.fnb-select').value;
      const qty = parseInt(row.querySelector('.fnb-qty').value) || 0;
      const itemPrice = fnbMenu[selectedIndex].price;
      const subtotal = itemPrice * qty;

      row.querySelector('.fnb-subtotal').value = `Rp ${subtotal.toLocaleString('id-ID')}`;
      fnbTotal += subtotal;
    });

    document.getElementById('fnb-cost-text').innerText = `Rp ${fnbTotal.toLocaleString('id-ID')}`;

    // 3. Hitung Diskon Member (Diskon hanya berlaku untuk Lapangan)
    const discountRate = parseFloat(document.getElementById('select-member').value);
    const discountAmount = courtCost * discountRate;
    document.getElementById('discount-text').innerText = `- Rp ${discountAmount.toLocaleString('id-ID')}`;

    // 4. Grand Total
    const grandTotal = (courtCost - discountAmount) + fnbTotal;
    document.getElementById('grand-total-text').innerText = `Rp ${grandTotal.toLocaleString('id-ID')}`;
  }

  function submitBooking() {
    const teamA = document.getElementById('team-a').value || "Tim A";
    const teamB = document.getElementById('team-b').value || "Tim B";
    const total = document.getElementById('grand-total-text').innerText;

    alert(`Reservasi berhasil disimpan!\n\nPertandingan: ${teamA} vs ${teamB}\nTotal Pembayaran: ${total}`);
  }

  // Load 1 baris F&B pertama secara otomatis saat awal dibuka
  window.onload = function() {
    addFnbRow();
  };
</script>

</body>
</html>
