<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Padel Scoreboard Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .scoreboard { background: #1e1e1e; width: 100%; max-width: 600px; border-radius: 12px; padding: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h1 { text-align: center; margin-bottom: 20px; font-size: 24px; color: #00e676; text-transform: uppercase; }
    
    .team-row { display: grid; grid-template-columns: 2fr 1fr 1fr 1.5fr; gap: 10px; align-items: center; margin-bottom: 15px; background: #2a2a2a; padding: 15px; border-radius: 8px; }
    .team-name { font-size: 18px; font-weight: bold; }
    .stat-box { text-align: center; }
    .stat-label { font-size: 10px; color: #aaa; text-transform: uppercase; display: block; }
    .stat-value { font-size: 22px; font-weight: bold; color: #fff; }
    .score-value { font-size: 32px; font-weight: bold; color: #00e676; }

    .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    button { background: #333; color: #fff; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #444; }
    button.score-btn { background: #00e676; color: #000; }
    button.score-btn:hover { background: #00c853; }
    button.reset-btn { background: #ff5252; color: #fff; grid-column: span 2; margin-top: 10px; }
    button.reset-btn:hover { background: #d50000; }

    .status-bar { text-align: center; margin-top: 15px; font-size: 14px; font-weight: bold; color: #ffeb3b; min-height: 20px; }
  </style>
</head>
<body>

<div class="scoreboard">
  <h1>Padel Scoreboard</h1>

  <!-- Tim A -->
  <div class="team-row">
    <div class="team-name">Tim A</div>
    <div class="stat-box"><span class="stat-label">Set</span><span id="sets-a" class="stat-value">0</span></div>
    <div class="stat-box"><span class="stat-label">Game</span><span id="games-a" class="stat-value">0</span></div>
    <div class="stat-box"><span class="stat-label">Poin</span><span id="points-a" class="score-value">0</span></div>
  </div>

  <!-- Tim B -->
  <div class="team-row">
    <div class="team-name">Tim B</div>
    <div class="stat-box"><span class="stat-label">Set</span><span id="sets-b" class="stat-value">0</span></div>
    <div class="stat-box"><span class="stat-label">Game</span><span id="games-b" class="stat-value">0</span></div>
    <div class="stat-box"><span class="stat-label">Poin</span><span id="points-b" class="score-value">0</span></div>
  </div>

  <!-- Status / Info -->
  <div id="status" class="status-bar">Game Dimulai</div>

  <!-- Tombol Kontrol -->
  <div class="controls">
    <button class="score-btn" onclick="addPoint('A')">+ Poin Tim A</button>
    <button class="score-btn" onclick="addPoint('B')">+ Poin Tim B</button>
    <button class="reset-btn" onclick="resetMatch()">Reset Pertandingan</button>
  </div>
</div>

<script>
  // State Pertandingan
  const pointSequence = ["0", "15", "30", "40"];
  let points = { A: 0, B: 0 };
  let games = { A: 0, B: 0 };
  let sets = { A: 0, B: 0 };
  let isTiebreak = false;

  function updateUI() {
    // Format Tampilan Poin
    if (isTiebreak) {
      document.getElementById("points-a").innerText = points.A;
      document.getElementById("points-b").innerText = points.B;
    } else {
      document.getElementById("points-a").innerText = pointSequence[points.A] || "40";
      document.getElementById("points-b").innerText = pointSequence[points.B] || "40";
    }

    document.getElementById("games-a").innerText = games.A;
    document.getElementById("games-b").innerText = games.B;
    document.getElementById("sets-a").innerText = sets.A;
    document.getElementById("sets-b").innerText = sets.B;
  }

  function addPoint(team) {
    const opponent = team === 'A' ? 'B' : 'A';

    // 1. Logika Tiebreak
    if (isTiebreak) {
      points[team]++;
      if (points[team] >= 7 && (points[team] - points[opponent] >= 2)) {
        winGame(team);
      }
      updateUI();
      return;
    }

    // 2. Logika Standar Padel (Golden Point / No-Ad pada 40-40)
    if (points.A === 3 && points.B === 3) {
      // Deuce / Golden Point: Siapa yang menang poin ini langsung menang game
      winGame(team);
      document.getElementById("status").innerText = `Golden Point dimenangkan oleh Tim ${team}!`;
      return;
    }

    if (points[team] < 3) {
      points[team]++;
    } else {
      winGame(team);
    }

    updateUI();
  }

  function winGame(team) {
    games[team]++;
    points.A = 0;
    points.B = 0;
    document.getElementById("status").innerText = `Game untuk Tim ${team}`;

    const opponent = team === 'A' ? 'B' : 'A';

    // Cek Tiebreak (6-6)
    if (games.A === 6 && games.B === 6) {
      isTiebreak = true;
      document.getElementById("status").innerText = "TIEBREAK!";
      return;
    }

    // Cek Kemenangan Set (Min. 6 game & selisih 2, atau menang tiebreak 7-6)
    if ((games[team] >= 6 && games[team] - games[opponent] >= 2) || (isTiebreak && games[team] === 7)) {
      winSet(team);
    }
  }

  function winSet(team) {
    sets[team]++;
    games.A = 0;
    games.B = 0;
    isTiebreak = false;
    document.getElementById("status").innerText = `Set dimenangkan oleh Tim ${team}!`;

    // Cek Pemenang Match (Best of 3)
    if (sets[team] === 2) {
      document.getElementById("status").innerText = `PERTANDINGAN SELESAI! TIM ${team} MENANG!`;
      disableButtons(true);
    }
  }

  function resetMatch() {
    points = { A: 0, B: 0 };
    games = { A: 0, B: 0 };
    sets = { A: 0, B: 0 };
    isTiebreak = false;
    document.getElementById("status").innerText = "Game Dimulai";
    disableButtons(false);
    updateUI();
  }

  function disableButtons(disabled) {
    const btns = document.querySelectorAll('.score-btn');
    btns.forEach(btn => btn.disabled = disabled);
  }
</script>

</body>
</html>
